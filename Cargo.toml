[workspace]
members = [
    "desktop/desktopd"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["os_name contributors"]

[workspace.dependencies]
anyhow = "1.0.100"
jsonschema = "0.49.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }
