---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/log
    subvolume: /@var_log
  - mountPoint: /.snapshots
    subvolume: /@snapshots

mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd ]
  - filesystem: ext4
    options: [ defaults, noatime ]
