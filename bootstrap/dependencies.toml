needed_by = ["gcc"]
note = "Requires gmp and mpfr."

[[component]]
name = "isl"
phase = "toolchain"
role = "toolchain-mathlib"
upstream = "https://libisl.sourceforge.io/"
pinned = true
needed_by = ["gcc"]
note = "Optional (Graphite loop optimizations); requires gmp. Pin or drop explicitly."

