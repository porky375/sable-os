# --- chroot-base: crypto / TLS stack (frontier audit complete 2026-07-25) ---
# Each subtree was audited against the host's real build. Sable builds a MINIMAL
# base: only the pacman-critical deps are in-closure; heavier optional features
# are disabled at configure time and recorded per component below.

[[component]]
name = "openssl"
phase = "chroot-base"
role = "crypto"
upstream = "https://www.openssl.org/"
pinned = true
needed_by = ["linux-lts", "curl", "libarchive"]
note = "Required deps (perl build-time, zlib, zstd) pinned. Optional brotli TLS cert compression is disabled."

[[component]]
name = "libarchive"
phase = "chroot-base"
role = "system-lib"
upstream = "https://www.libarchive.org/"
pinned = true
needed_by = ["pacman"]
note = "Requires zlib, xz, bzip2, zstd, openssl."

[[component]]
name = "nghttp2"
phase = "chroot-base"
role = "tls"
upstream = "https://nghttp2.org/"
pinned = true
needed_by = ["curl"]

[[component]]
name = "curl"
phase = "chroot-base"
role = "tls"
upstream = "https://curl.se/"
pinned = true
needed_by = ["pacman"]
note = "libcurl built TLS-only: openssl + zlib + nghttp2 + zstd (all pinned). Disabled: krb5, libidn2, libpsl, libssh2, HTTP/3 (ngtcp2/nghttp3), brotli. ca-certificates is runtime trust-store data (a package, not a source)."

[[component]]
name = "libgpg-error"
phase = "chroot-base"
role = "crypto"
upstream = "https://gnupg.org/software/libgpg-error/"
pinned = true
needed_by = ["libgcrypt", "libassuan", "gpgme", "gnupg"]

[[component]]
name = "libassuan"
phase = "chroot-base"
role = "crypto"
upstream = "https://gnupg.org/software/libassuan/"
pinned = true
needed_by = ["gpgme", "gnupg"]

[[component]]
name = "libgcrypt"
phase = "chroot-base"
role = "crypto"
upstream = "https://gnupg.org/software/libgcrypt/"
pinned = true
needed_by = ["gnupg"]

[[component]]
name = "libksba"
phase = "chroot-base"
role = "crypto"
upstream = "https://gnupg.org/software/libksba/"
pinned = true
needed_by = ["gnupg"]

[[component]]
name = "npth"
phase = "chroot-base"
role = "crypto"
upstream = "https://gnupg.org/software/npth/"
pinned = true
needed_by = ["gnupg"]

[[component]]
name = "gnupg"
phase = "chroot-base"
role = "crypto"
upstream = "https://gnupg.org/"
pinned = true
needed_by = ["pacman"]
note = "Runtime gpg for package signature verification. Required deps (the pinned libgcrypt stack, zlib, bzip2, readline) plus sqlite for the TOFU trust DB. Disabled for the minimal base: gnutls/ntbtls (HKPS keyservers), libldap (LDAP keyservers), libusb (smartcards), tpm2-tss, pinentry (needed only for signing, not verification)."

[[component]]
name = "sqlite"
phase = "chroot-base"
role = "system-lib"
upstream = "https://sqlite.org/"
pinned = true
needed_by = ["gnupg"]
note = "TOFU trust database for gnupg. Amalgamation build; deps (readline, zlib) pinned."

[[component]]
name = "gpgme"
phase = "chroot-base"
role = "crypto"
upstream = "https://gnupg.org/software/gpgme/"
pinned = true
needed_by = ["pacman"]
note = "Requires libgpg-error, libassuan, gnupg."

