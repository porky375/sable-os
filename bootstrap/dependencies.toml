# Stage-0 transitive dependency audit
#
# Companion to bootstrap/sources.toml. sources.toml pins the six top-level
# self-hosting *targets*; this file enumerates the transitive source and
# build-dependency closure required to build those targets without the host
# distribution in the final result.
#
# This file is an ENUMERATION, not a pinned manifest. It deliberately asserts
# no independence and stores no hashes. Every component here must ultimately be
# pinned with an immutable revision + SHA-256 (+ signature where upstream
# publishes one) in one of:
#   - bootstrap/sources.toml   for the toolchain phases, or
#   - packages/<pkg>/PKGBUILD  for the chroot-base phase.
#
# See docs/STAGE0_BOOTSTRAP.md for the phase model, build order, and the
# acceptance criteria that must pass before independence may be claimed.

schema_version = 1
architecture = "x86_64"
status = "DRAFT"        # enumeration under review; not a verified closure
independence = false    # this file never asserts an independent runtime

# ---------------------------------------------------------------------------
# Phases, in build order. Each phase builds only against the host seed (phase
# "seed") or against artifacts produced by strictly earlier phases.
# ---------------------------------------------------------------------------

[[phase]]
id = "seed"
order = 0
environment = "host"
description = """
Disposable Arch/CachyOS host toolchain. Produces stage-0 artifacts only and \
must not appear in the final closure. Exact provenance is captured separately \
by bootstrap/capture-host-seed (task host-seed-provenance)."""

[[phase]]
id = "toolchain"
order = 1
environment = "seed"
description = """
Two-pass self-hosting toolchain. Pass 1 builds binutils and a minimal C-only \
gcc with the seed; the Linux API headers and glibc are installed; pass 2 \
rebuilds binutils and gcc against the new glibc so the toolchain no longer \
references the seed sysroot."""

[[phase]]
id = "temp-tools"
order = 2
environment = "toolchain"
description = """
Minimal POSIX userland built with the pass-2 toolchain: just enough to enter \
a clean chroot with no seed binaries on PATH."""

[[phase]]
id = "chroot-base"
order = 3
environment = "chroot"
description = """
Independent base rebuilt as signed Sable packages inside a clean chroot via \
makechrootpkg. systemd, pacman, and the crypto/TLS stack live here, not in \
the toolchain phases; pulling their full closure into stage-0 is unnecessary \
and explodes the graph."""

# ---------------------------------------------------------------------------
# Components. `pinned = true` means the source is already in sources.toml.
# `phase` is the earliest phase that consumes the source. `frontier = true`
# marks a component whose own transitive leaves still need a deeper audit
# pass before its subtree can be called complete.
# ---------------------------------------------------------------------------

# --- toolchain: core ---

[[component]]
name = "binutils"
phase = "toolchain"
role = "toolchain-core"
upstream = "https://sourceware.org/binutils/"
pinned = true
needed_by = ["gcc", "glibc", "linux-lts"]
note = "Built in pass 1 (seed) and pass 2 (against new glibc)."

[[component]]
name = "gcc"
phase = "toolchain"
role = "toolchain-core"
upstream = "https://gcc.gnu.org/"
pinned = true
needed_by = ["glibc", "temp-tools", "chroot-base"]
note = "Pass 1 is C-only; pass 2 is the final native compiler."

[[component]]
name = "linux-lts"
phase = "toolchain"
role = "api-headers"
upstream = "https://www.kernel.org/"
pinned = true
needed_by = ["glibc", "chroot-base"]
note = "API headers are installed early; the kernel proper builds in chroot-base."

[[component]]
name = "glibc"
phase = "toolchain"
role = "toolchain-core"
upstream = "https://www.gnu.org/software/libc/"
pinned = true
needed_by = ["gcc", "temp-tools", "chroot-base"]
note = "Requires Linux API headers and the pass-1 toolchain."

