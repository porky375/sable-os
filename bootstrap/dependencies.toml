[[component]]
name = "gmp"
phase = "toolchain"
role = "toolchain-mathlib"
upstream = "https://gmplib.org/"
pinned = true
needed_by = ["gcc", "mpfr", "mpc"]
note = "GCC prerequisite. Buildable in-tree but the source is still in-closure."

[[component]]
name = "mpfr"
phase = "toolchain"
role = "toolchain-mathlib"
upstream = "https://www.mpfr.org/"
