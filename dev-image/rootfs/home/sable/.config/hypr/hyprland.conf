monitor = ,preferred,auto,1

$terminal = kitty
$fileManager = thunar

exec-once = systemctl --user start sable-desktopd.service
exec-once = quickshell --path /usr/share/sable/shell/shell.qml
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = mako
exec-once = sable-control apply
exec-once = xdg-user-dirs-update
exec-once = xdg-settings set default-web-browser firefox.desktop
exec-once = sh -c "sleep 4; /usr/local/bin/sable-session-ready"

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

input {
    kb_layout = gb
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(f4f4f5dd)
    col.inactive_border = rgba(52525b99)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6
    active_opacity = 0.97
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000088)
    }
}

animations {
    enabled = true
    bezier = sable, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, sable
    animation = workspaces, 1, 4, sable, slide
    animation = fade, 1, 3, default
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    force_default_wallpaper = 0
}

# Interim: open new windows floating so they can be dragged by their own
# (client-side) title bars, for a conventional desktop feel. The proper
# draggable server-side caption + min/max/close is desktop/hypr-plugin, which
# is not built yet; remove this block once that plugin handles window moves.
windowrule {
    name = float-by-default
    match:class = .*
    float = true
}

windowrule {
    name = opaque-games
    match:class = ^(steam_app_.*|gamescope|steam_proton)$
    opacity = 1.0 override 1.0 override
    no_blur = true
}

windowrule {
    name = floating-utilities
    match:class = ^(org.pulseaudio.pavucontrol|wdisplays|qml6)$
    float = true
    center = true
    size = 900 600
}

bind = SUPER, Return, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, V, togglefloating,
bind = SUPER, L, exec, hyprlock
bind = SUPER, I, exec, sable-installer
bind = SUPER, M, movetoworkspacesilent, special:minimized
bind = SUPER SHIFT, M, togglespecialworkspace, minimized
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = , Print, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; grim "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png"'
bind = SUPER SHIFT, S, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png"'
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
