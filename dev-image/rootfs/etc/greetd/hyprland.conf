monitor = ,preferred,auto,1

env = GTK_USE_PORTAL,0
env = GDK_DEBUG,no-portals
env = XCURSOR_SIZE,24

exec-once = regreet --style /etc/greetd/regreet.css; hyprctl dispatch exit

input {
    kb_layout = gb
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = sable, 0.22, 1, 0.36, 1
    animation = windows, 1, 3, sable
    animation = fade, 1, 3, default
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    force_default_wallpaper = 0
}
