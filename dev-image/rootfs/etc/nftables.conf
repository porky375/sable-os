#!/usr/bin/nft -f
#
# Sable default firewall: an inbound-deny workstation policy (docs/SECURITY.md).
# Inbound is dropped except loopback, replies to connections the machine
# started, and basic ICMP. All outbound is allowed, so the web, downloads,
# pacman, and the local AI (Ollama on loopback) keep working.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
